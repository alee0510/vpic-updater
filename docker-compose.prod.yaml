networks:
  vpic_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  control_pgdata:
  target_pgdata:

services:
  control-db:
    image: postgres:17
    environment:
      POSTGRES_DB: vpic_meta
      POSTGRES_USER: vpic_admin
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
    volumes:
      - control_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init_vpic_meta.sql:/docker-entrypoint-initdb.d/10-init-vpic-meta.sql:ro
      - ./docker/postgres/pg_hba.conf.template:/docker-entrypoint-initdb.d/pg_hba.conf.template:ro
      - ./docker/postgres/set-hba.sh:/docker-entrypoint-initdb.d/20-set-hba.sh:ro
    networks:
      - vpic_net
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpic_admin -d vpic_meta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  target-db:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vpic_admin
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD}
      VPIC_USER_PASSWORD: ${VPIC_USER_PASSWORD}
    volumes:
      - target_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/set-app-role.sh:/docker-entrypoint-initdb.d/10-set-app-role.sh:ro
      - ./docker/postgres/pg_hba.conf.template:/docker-entrypoint-initdb.d/pg_hba.conf.template:ro
      - ./docker/postgres/set-hba.sh:/docker-entrypoint-initdb.d/20-set-hba.sh:ro
    networks:
      - vpic_net
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpic_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  updater:
    image: ${REGISTRY}/vpic-updater:${IMAGE_TAG:-latest}
    depends_on:
      control-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
    env_file: .env
    networks:
      - vpic_net
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
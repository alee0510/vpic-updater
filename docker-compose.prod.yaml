networks:
  vpic_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

volumes:
  control_pgdata:
  target_pgdata:

services:
  control-db:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: vpic_meta
      POSTGRES_USER: vpic_admin
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
      DOCKER_SUBNET: ${DOCKER_SUBNET}
    volumes:
      - control_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init_vpic_meta.sql:/docker-entrypoint-initdb.d/10-init-vpic-meta.sql:ro
    networks:
      - vpic_net
    ports:
      - "0.0.0.0:5433:5432"   # public -- open to all external requests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpic_admin -d vpic_meta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  target-db:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vpic_admin
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD}
      VPIC_USER_PASSWORD: ${VPIC_USER_PASSWORD}
      DOCKER_SUBNET: ${DOCKER_SUBNET}
    volumes:
      - target_pgdata:/var/lib/postgresql/data
    networks:
      - vpic_net
    ports:
      - "0.0.0.0:5434:5432"   # public -- open to all external requests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpic_admin"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  updater:
    image: ${REGISTRY}/vpic-updater:${IMAGE_TAG:-latest}
    depends_on:
      control-db:
        condition: service_healthy
      target-db:
        condition: service_healthy
    env_file: .env
    networks:
      - vpic_net
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs